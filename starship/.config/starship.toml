add_newline = false
command_timeout = 200
format = "$username@$hostname $directory$git_branch$git_status$character"

[username]
show_always = true
style_user = "none"
style_root = "none"
format = "[$user]($style)"

[hostname]
ssh_only = false
trim_at = "."
style = "none"
format = "[$hostname]($style)"

[character]
error_symbol = '[\$](none)'
success_symbol = '[\$](none)'
format = "$symbol "

[directory]
truncation_length = 1
truncation_symbol = ""
style = "bold cyan"
format = "[$path]($style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style) '
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
